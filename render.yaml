services:
  - type: web
    name: quantik-futures-arena
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
# For persistent leaderboards, use a Render plan supporting persistent disks
# and point ARENA_DATA_DIR to its mount path. No public deployment is made here.
